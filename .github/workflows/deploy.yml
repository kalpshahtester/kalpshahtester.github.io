name: Deploy Vite portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage legacy public URLs for Vite
        run: |
          mkdir -p public
          cp -R assets public/assets
          cp -R projects public/projects
          cp "Kalp Shah Profile Photo.png" public/
          cp "Kalp Shah Manual Tester Resume.pdf" public/
          cp "Kalp Shah HCL GUVI Certification.png" public/
          cp "Kalp Shah Generative AI Mastermind Course Certificate.jpeg" public/
          cp "Kalp Shah Outskill Certificate.png" public/
          cp favicon.ico favicon.svg robots.txt sitemap.xml public/
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
