name: Production portfolio smoke test
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-site:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check published routes
        run: |
          for path in / /projects/saucedemo.html /projects/makemytrip.html; do
            curl --fail --silent --show-error --location "https://kalpshahtester.github.io${path}" > /tmp/page.html
            grep -qi "Kalp Shah" /tmp/page.html
          done

