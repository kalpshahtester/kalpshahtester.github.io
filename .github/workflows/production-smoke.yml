name: Production portfolio smoke test
on:
  workflow_run:
    workflows:
      - Deploy Vite portfolio to GitHub Pages
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: portfolio-production-smoke
  cancel-in-progress: true
jobs:
  verify-live-site:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify every live route and local resource
        run: BASE_URL=https://kalpshahtester.github.io npm run smoke
