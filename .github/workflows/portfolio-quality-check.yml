name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage the same public URLs used by deployment
        run: node scripts/stage-pages-assets.mjs
      - run: npm run check
      - run: npm run build
      - name: Verify the generated Pages artifact
        run: node scripts/verify-pages-build.mjs
      - name: Start server against dist
        run: |
          SITE_ROOT=dist PORT=4173 node scripts/serve-site.mjs > /tmp/portfolio-test-server.log 2>&1 &
          echo $! > /tmp/portfolio-test-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
      - name: Smoke test built routes and every local resource
        run: BASE_URL=http://127.0.0.1:4173 npm run smoke
      - name: Install Playwright without changing the project lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit built pages across desktop, tablet and mobile
        run: BASE_URL=http://127.0.0.1:4173 node scripts/browser-interaction-smoke.mjs
      - name: Stop test server
        if: always()
        run: |
          if [ -f /tmp/portfolio-test-server.pid ]; then
            kill "$(cat /tmp/portfolio-test-server.pid)" || true
          fi
