name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate required routes and public assets
        run: |
          test -f dist/index.html
          test -f projects/saucedemo.html
          test -f projects/makemytrip.html
          test -f "Kalp Shah Profile Photo.png"
          test -f "Kalp Shah Manual Tester Resume.pdf"

