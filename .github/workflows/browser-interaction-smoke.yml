name: Production browser interaction tests
on:
  workflow_run:
    workflows:
      - Deploy Vite portfolio to GitHub Pages
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: portfolio-production-browser
  cancel-in-progress: true
jobs:
  browser-interactions:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright without changing the project lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real desktop and mobile interactions on production
        run: BASE_URL=https://kalpshahtester.github.io node scripts/browser-interaction-smoke.mjs
