name: Production browser interaction tests
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-interactions:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright without changing the project lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real desktop and mobile interactions on production
        run: BASE_URL=https://kalpshahtester.github.io node scripts/browser-interaction-smoke.mjs
